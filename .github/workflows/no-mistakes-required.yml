name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: [self-hosted, fm-parallel]
    # Same policy as the self-hosted jobs in ci.yml: a fork PR must never be
    # scheduled onto the maintainer's own machines, even for a job that only
    # reads the PR body and never checks out the head code.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Fetch PR body from the API
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          delim="NM_PR_BODY_$(openssl rand -hex 16)"
          {
            echo "body<<${delim}"
            gh pr view "$PR_NUMBER" --repo "$REPO" --json body -q '.body // ""'
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      # PR-57-only exemption (captain ruling, upstream-sync-20260903): the test step was
      # deliberately skipped because the merge's full-suite evidence (~73min, gate-3 triage
      # in the PR description) exceeds the pipeline's 30m test-step ceiling. Inert after
      # PR #57 merges; do not extend to any other PR.
      #
      # PR-105-only exemption (captain ruling, 2026-09-14): the test step's own diff-scoped
      # test passed cleanly every time (tests/fm-pi-watch-extension.test.sh, exit=0); the
      # skip is solely a pre-existing, unrelated watcher-daemon flaky-test family failing
      # under sustained host load (20-38+ load average), confirmed non-reproducing against
      # this PR's changes across multiple genuine (non-skip) retries. Inert after PR #105
      # merges; do not extend to any other PR.
      #
      # PR-107-only exemption (captain ruling, 2026-09-14): every composer/footer test the
      # diff touches passed cleanly (fm-composer-lib.test.sh, fm-composer-ghost.test.sh,
      # exit=0); the skip is solely 3 unrelated failures (fm-backend-herdr.test.sh race, plus
      # 900s per-script timeouts in fm-lint.test.sh and fm-captain-hold-lifecycle.test.sh)
      # under transient ~70 load-avg host contention. Inert after PR #107 merges; do not
      # extend to any other PR.
      - name: PR 57 attestation exemption notice
        if: github.event.pull_request.number == 57
        run: echo "Attestation exempted for PR 57 (upstream-sync merge; full-suite test evidence recorded in PR description per captain ruling)."

      - name: PR 105 attestation exemption notice
        if: github.event.pull_request.number == 105
        run: echo "Attestation exempted for PR 105 (pi-watch-arm-spawn-hang-fix; pre-existing unrelated watcher-daemon flake under host load, per captain ruling)."

      - name: PR 107 attestation exemption notice
        if: github.event.pull_request.number == 107
        run: echo "Attestation exempted for PR 107 (opencode composer-footer fix; unrelated test-step failures traced to host load, not the diff, per captain ruling)."

      - name: Verify no-mistakes signature and pipeline attestation
        if: github.event.pull_request.number != 57 && github.event.pull_request.number != 105 && github.event.pull_request.number != 107
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@32d396ac0f29135daf7fcb9964aba9d5f4e796d6 # post-v1.57.1, untagged (action added in #819)
        with:
          # synchronize webhook payloads can omit pull_request.body, so the action's own
          # GITHUB_EVENT_PATH fallback sees an empty body and fails. Fetch the body live
          # from the API and pass PR context explicitly instead of trusting event context.
          pr-body: ${{ steps.pr.outputs.body }}
          pr-head-sha: ${{ github.event.pull_request.head.sha }}
          pr-head-ref: ${{ github.event.pull_request.head.ref }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-number: ${{ github.event.pull_request.number }}
