# Per-repo no-mistakes overrides.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# the NO_MISTAKES_GATE lifecycle refusal (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# Trusted documentation placement policy for the Document step.
# The audience inventory and coding guideline own the detail; keep this as a
# pointer so gate instructions cannot become a second prose policy.
document:
  instructions: |
    Read docs/documentation-audiences.md and its machine-consumed
    docs/documentation-audiences.json inventory before changing documentation.
    Apply the knowledge-placement policy in
    .agents/skills/firstmate-coding-guidelines/SKILL.md.
    For changed prose, verify audience, authoritative owner, current relevance,
    evidence destination, and unique safety facts, then review the complete
    branch diff again after every documentation or lint fix.

# Pin lint to the same owner CI invokes instead of leaving it to no-mistakes'
# default handling, which does not invoke the repository's canonical lint gate.
# `bin/fm-lint.sh` owns the context-sensitive ShellCheck modes and GitHub
# workflow lint via pinned actionlint in `bin/fm-lint-workflows.sh`.
# Invocation wiring is asserted by `tests/fm-lint.test.sh` and
# `tests/fm-lint-workflows.test.sh`.
#
# commands.test is pinned to the canonical --changed invocation;
# bin/fm-lint.sh guards against it drifting to a per-branch workaround.
commands:
  lint: 'bin/fm-lint.sh'
  test: 'bin/fm-test-run.sh --changed --exclude-family real-herdr-gated --pc02-if-idle'

# Publish each run's test evidence to the orphan no-mistakes/evidence branch linked from the PR.
# The evidence is not committed to the feature or default branch.
test:
  evidence:
    store_in_repo: true

# The pinned full-suite invocation above can exceed the 30m default test agent
# timeout under host load. no-mistakes reads this key only from the
# default-branch copy of this file, so a branch edit cannot raise it.
test_agent_timeout: "60m"

# Maintainability rules the Review step applies to the surfaces where this repo
# has repeatedly paid for getting them wrong. Kept as pointers for the same
# reason `document.instructions` is: the coding guideline owns the policy, and a
# second prose copy here would become a competing owner. Schema caps both the
# entry count and the total bytes added to the review prompt, so keep each
# entry short.
review:
  path_instructions:
    - path: 'bin/*.sh'
      instructions: |
        Apply .agents/skills/firstmate-coding-guidelines/SKILL.md. Check that
        the script has one owner for its contract and does not restate a rule
        another file owns, that its header and --help agree with what it does,
        that it is shellcheck-clean, and that a failure mode refuses with a
        concrete diagnostic rather than silently continuing.
    - path: 'tests/*.test.sh'
      instructions: |
        Check that each test asserts observable behavior rather than the
        implementation's current shape, that it covers the failure exits and
        not just the happy path, and that a documented deliberate limitation
        has a test pinning it so a later change cannot silently reintroduce
        the rejected approach.
    - path: 'AGENTS.md'
      instructions: |
        Apply .agents/skills/firstmate-coding-guidelines/SKILL.md. Verify
        AGENTS.md stays within the resident-size ceiling owned by
        bin/fm-agentsmd-size.sh (do not re-spell the value here); trim
        resident lookup tables duplicated in docs/configuration.md; preserve
        all safety boundaries and hard rules verbatim.
